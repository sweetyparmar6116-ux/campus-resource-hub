<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Welcome to CampusHub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&family=Playfair+Display:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
<style>
:root{--forest:#183d32;--leaf:#d8e7c4;--cream:#f6f0e4;--gold:#d3b37b}
*{box-sizing:border-box}body{margin:0;background:var(--forest);color:var(--cream);font-family:'DM Sans',sans-serif;min-height:100vh;display:grid;place-items:center;overflow:hidden}.loader-bg{position:fixed;inset:-20%;background:radial-gradient(ellipse at 25% 25%,#37624c 0,transparent 45%),radial-gradient(ellipse at 80% 75%,#0d2b23 0,transparent 45%);animation:breath 7s ease-in-out infinite alternate}.leaf{position:fixed;color:#8da982;opacity:.18;font-size:clamp(90px,18vw,230px);animation:float 9s ease-in-out infinite}.leaf.l1{top:-45px;left:5%;transform:rotate(-35deg)}.leaf.l2{right:1%;bottom:-70px;animation-delay:-4s;transform:rotate(28deg)}.loader{position:relative;text-align:center;padding:35px}.mark{font-size:43px;color:var(--leaf);display:inline-block;animation:spin 12s linear infinite}.name{font-size:clamp(34px,5vw,56px);font-weight:700;letter-spacing:-2px;margin:8px 0}.name span{font-family:'Playfair Display',serif;font-style:italic;color:var(--leaf)}.tag{letter-spacing:3px;font-size:10px;color:#c1d0bd}.track{height:3px;width:min(270px,70vw);background:#ffffff20;margin:35px auto 14px;border-radius:4px;overflow:hidden}.bar{height:100%;background:var(--gold);transform-origin:left;animation:load 1.65s ease-in-out forwards}.hint{font-size:11px;color:#b7c9b9}.skip{position:fixed;right:24px;bottom:24px;color:#e9e7d7;text-decoration:none;font-size:12px;border:1px solid #ffffff35;border-radius:30px;padding:10px 15px}.skip:hover{background:#ffffff12}@keyframes load{from{transform:scaleX(0)}to{transform:scaleX(1)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes float{50%{translate:0 -20px;rotate:8deg}}@keyframes breath{to{transform:scale(1.08);opacity:.7}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important}}
</style>
</head>
<body>
<div class="loader-bg"></div><div class="leaf l1">❧</div><div class="leaf l2">❧</div>
<div class="loader" role="status" aria-live="polite"><div class="mark">✳</div><div class="name">Campus<span>Hub</span></div><div class="tag">BETTER SPACES. BRIGHTER IDEAS.</div><div class="track"><div class="bar"></div></div><div class="hint">Finding room for your next big idea…</div></div>
<a class="skip" href="/">Skip intro ↗</a>
<script>
(function(){const reduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches;const seen=sessionStorage.getItem('campushubIntroSeen');if(seen||reduced){window.location.replace('/');return;}sessionStorage.setItem('campushubIntroSeen','1');setTimeout(()=>window.location.replace('/'),1750);})();
</script>
</body>
</html>
